<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>perfect number</title>
</head>
<body>
    <script>
    let a = 28;
    let temp = a;
    let sum = 0; 
    for (let i = 1; i < a; i++) {
        if (a % i == 0) {
            sum += i;
        }
    }

    if (sum == temp) {
        document.write("perfect"); 
    } else {
        document.write("not perfect");
    }
</script>
</body>
</html>
